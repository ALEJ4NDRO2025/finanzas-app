name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_B64: se firma con la llave de depuración"
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk mis-finanzas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mis-finanzas-apk
          path: mis-finanzas.apk

      # Enlace fijo para descargar desde el celular:
      # https://github.com/ALEJ4NDRO2025/finanzas-app/releases/latest/download/mis-finanzas.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Mis Finanzas para Android (v1.${{ github.run_number }})
          body: Descarga mis-finanzas.apk e instálalo en tu celular.
          files: mis-finanzas.apk
          make_latest: true
